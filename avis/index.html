<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Avis</title>
  <link rel="icon" href="/avis/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/avis/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/avis/apple-touch-icon.png">
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css?v=73d387b">
  <link rel="stylesheet" href="css/avis.css?v=73d387b">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innholdet</a>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Til forsiden">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-name">Avis</span>
    </a>
    <p class="updated" id="updated"></p>
    <div class="auth" id="auth"></div>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Bytt til mørkt tema">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main">
    <p class="notice" id="notice" hidden></p>

    <div class="avis" id="avis" hidden>
      <!-- Dagen: bla mellom utgavene med pilene. Lenke til en bestemt dag: /avis/#2026-11-18 -->
      <div class="dag">
        <button class="nav-btn" type="button" id="forrige" aria-label="Forrige utgave" title="Forrige utgave" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="dag-head">
          <h1 id="dag-tittel"></h1>
          <p class="ingress" id="ingress"></p>
        </div>
        <button class="nav-btn" type="button" id="neste" aria-label="Neste utgave" title="Neste utgave" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div class="seg filter" id="filter" role="radiogroup" aria-label="Seksjon"></div>

      <section class="saker" id="saker" aria-label="Sakene"></section>

      <!-- Dagens stilling: én utlyst stilling i Stockholm, med egne tomler. Bare i utgaven den hører til. -->
      <section class="stilling-blokk" id="stilling-blokk" aria-labelledby="stilling-tittel" hidden>
        <h2 id="stilling-tittel">Dagens stilling</h2>
        <div class="saker" id="stilling"></div>
      </section>

      <!-- Uvurderte saker fra de siste dagene. Vises bare i den nyeste utgaven. -->
      <section class="eldre-blokk" id="eldre-blokk" aria-labelledby="eldre-tittel" hidden>
        <h2 id="eldre-tittel">Fra tidligere dager</h2>
        <div class="saker" id="eldre"></div>
      </section>

      <!-- Saker som var vurdert da siden ble lastet: skjult, men kan hentes fram igjen. -->
      <div class="leste-rad"><button class="btn" type="button" id="vis-leste" aria-pressed="false" hidden>Vis vurderte</button></div>
    </div>
  </main>

  <!-- Hele saken: åpnes ved klikk på et kort, lukkes med ✕, Esc eller klikk utenfor. -->
  <dialog class="sak-dialog" id="dialog" aria-labelledby="d-tittel">
    <div class="dialog-inner">
      <div class="dialog-top">
        <p class="sak-meta" id="d-meta"></p>
        <button class="lukk" type="button" id="lukk" aria-label="Lukk" title="Lukk">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <h2 id="d-tittel"></h2>
      <div class="d-tekst" id="d-tekst"></div>
      <div class="hvorfor">
        <h3 id="d-hvorfor-tittel">Hvorfor du får denne</h3>
        <p id="d-hvorfor"></p>
      </div>
      <div>
        <h3 id="d-kilder-tittel">Kilder</h3>
        <ul class="kilder" id="d-kilder"></ul>
      </div>
      <div class="dialog-bunn" id="d-bunn"></div>
    </div>
  </dialog>

  <script src="/js/theme.js?v=73d387b"></script>
  <script type="module" src="js/avis.js?v=73d387b"></script>
</body>
</html>
