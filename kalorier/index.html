<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Kalorier</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="css/kalorier.css">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innholdet</a>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Til forsiden">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-name">Kalorier</span>
    </a>
    <div class="auth" id="auth"></div>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Bytt til mørkt tema">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main">
    <div class="page-head">
      <h1>Vekt</h1>
      <button class="btn btn-primary" type="button" id="sync" hidden>Hent fra vekta</button>
    </div>

    <p class="notice" id="notice" hidden></p>

    <div id="content" hidden>
      <section class="kpis" aria-label="Siste måling">
        <div class="tile">
          <span class="tile-label">Vekt</span>
          <span class="tile-value" id="kpi-weight">–</span>
          <span class="tile-delta" id="kpi-weight-sub"></span>
        </div>
        <div class="tile">
          <span class="tile-label">Fettprosent</span>
          <span class="tile-value" id="kpi-fat">–</span>
          <span class="tile-delta" id="kpi-fat-sub"></span>
        </div>
        <div class="tile">
          <span class="tile-label">Trend (snitt av siste 7 veiinger)</span>
          <span class="tile-value" id="kpi-trend">–</span>
          <span class="tile-delta" id="kpi-trend-sub"></span>
        </div>
      </section>

      <section class="panel panel-wide" aria-labelledby="chart-title">
        <div class="panel-head">
          <h2 id="chart-title">Vekt siste 90 dager</h2>
          <p class="panel-sub">Punkter er veiinger, linja er snittet av de siste 7</p>
        </div>
        <div class="chart" id="chart"></div>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="panel-head">
          <h2 id="list-title">Siste veiinger</h2>
        </div>
        <div class="table-scroll" id="list"></div>
      </section>
    </div>
  </main>

  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="/js/theme.js"></script>
  <script type="module" src="js/vekt.js"></script>
</body>
</html>
