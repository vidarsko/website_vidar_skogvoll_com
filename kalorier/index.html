<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Kalorier</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="css/kalorier.css?v=6bec68c">
  <link rel="icon" href="/kalorier/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/kalorier/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/kalorier/apple-touch-icon.png">
</head>
<body>
  <a class="skip-link" href="#main">Hopp til innholdet</a>

  <header class="topbar">
    <a class="brand" href="/" aria-label="Til forsiden">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span class="brand-name">Kalorier</span>
    </a>
    <div class="auth" id="auth"></div>
    <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Bytt til mørkt tema">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main id="main">
    <p class="notice" id="notice" hidden></p>

    <div id="content" hidden>
      <section class="panel day" aria-labelledby="day-title">
        <div class="day-nav">
          <button class="nav-btn" type="button" id="prev" aria-label="Forrige dag">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="day-head">
            <h1 id="day-title">I dag</h1>
            <span class="day-date" id="day-date"></span>
          </div>
          <button class="nav-btn" type="button" id="next" aria-label="Neste dag">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button class="btn" type="button" id="today">I dag</button>
        </div>
        <div class="day-sum">
          <div class="sum-line">
            <span class="sum-netto" id="sum-netto">0</span>
            <span class="sum-of">av <span id="sum-budget">0</span> kcal</span>
            <span class="status" id="sum-status"></span>
          </div>
          <div class="meter" aria-hidden="true"><div class="meter-fill" id="meter-fill"></div></div>
          <p class="sum-parts" id="sum-parts"></p>
        </div>
      </section>

      <details class="panel tanke" id="tanke" hidden>
        <summary>
          <span class="tanke-label">Dagens tanke</span>
          <span class="tanke-tittel" id="tanke-tittel"></span>
        </summary>
        <div class="tanke-tekst" id="tanke-tekst"></div>
        <p class="tanke-regel" id="tanke-regel" hidden></p>
        <!-- Tilbakemelding på lappen: knappen åpner popupen #tb. -->
        <div class="tanke-svar"><button class="btn" type="button" id="tanke-svar-knapp" aria-pressed="false">Tilbakemelding</button></div>
      </details>

      <section class="cats" aria-labelledby="mat-title">
        <h2 class="cats-title" id="mat-title">Mat</h2>
        <div class="cat-grid" id="grid-mat"></div>
      </section>

      <section class="cats" aria-labelledby="trening-title">
        <h2 class="cats-title" id="trening-title">Trening</h2>
        <div class="cat-grid" id="grid-trening"></div>
      </section>

      <section class="panel" aria-labelledby="log-title">
        <div class="panel-head"><h2 id="log-title">Logget</h2></div>
        <ul class="entries" id="entries"></ul>
        <p class="empty" id="entries-empty">Ingenting logget denne dagen.</p>
      </section>

      <section class="panel" aria-labelledby="week-title">
        <div class="week-nav">
          <button class="nav-btn" type="button" id="prev-week" aria-label="Forrige uke" title="Forrige uke">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="panel-head week-head">
            <h2 id="week-title">Uka</h2>
            <p class="panel-sub" id="week-sub"></p>
          </div>
          <button class="nav-btn" type="button" id="next-week" aria-label="Neste uke" title="Neste uke">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div class="week-days" id="week-days"></div>
      </section>

      <section class="panel" aria-labelledby="weeks-title">
        <div class="panel-head">
          <h2 id="weeks-title">Ukene før</h2>
          <p class="panel-sub" id="weeks-sub"></p>
        </div>
        <div class="table-scroll" id="weeks"></div>
        <button class="btn more" type="button" id="more-weeks">Vis flere uker</button>
      </section>

    </div>
  </main>

  <dialog class="entry-dialog" id="entry" aria-labelledby="entry-title">
    <form id="entry-form">
      <div class="entry-head">
        <span class="entry-icon" id="entry-icon" aria-hidden="true"></span>
        <div>
          <h2 id="entry-title"></h2>
          <p class="entry-info" id="entry-info"></p>
        </div>
        <button class="close" type="button" id="entry-close" aria-label="Lukk">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="entry-conv" id="entry-conv"></p>
      <p class="entry-kcal"><span id="entry-kcal">0</span> kcal</p>
      <label class="field">
        <span class="field-label">Mengde <output id="entry-amount"></output></span>
        <input type="range" id="entry-range">
      </label>
      <label class="field field-time">
        <span class="field-label">Tid</span>
        <input type="time" id="entry-time" required>
      </label>
      <label class="field" id="entry-note-field">
        <span class="field-label">Hva var det? (valgfritt)</span>
        <input type="text" id="entry-note" maxlength="200" autocomplete="off">
      </label>
      <div class="entry-actions">
        <button class="btn btn-danger" type="button" id="entry-delete">Slett</button>
        <button class="btn" type="button" id="entry-cancel">Avbryt</button>
        <button class="btn btn-primary" type="submit" id="entry-save">Legg inn</button>
      </div>
    </form>
  </dialog>

  <!-- Tilbakemelding på «Dagens tanke». Lukkes med Avbryt, ✕, Esc eller klikk utenfor. -->
  <dialog class="entry-dialog" id="tb" aria-labelledby="tb-tittel">
    <div class="tb-inner">
      <div class="tb-head">
        <h2 id="tb-tittel">Tilbakemelding</h2>
        <button class="close" type="button" id="tb-lukk" aria-label="Lukk">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="entry-info" id="tb-om"></p>
      <label class="sr-only" for="tanke-kommentar">Tilbakemelding på dagens tanke</label>
      <textarea id="tanke-kommentar" rows="5" maxlength="1000" placeholder="Hva traff, hva bommet?"></textarea>
      <p class="tanke-svar-status" id="tanke-svar-status" aria-live="polite"></p>
      <div class="entry-actions">
        <button class="btn" type="button" id="tb-avbryt">Avbryt</button>
        <button class="btn btn-primary" type="button" id="tanke-svar-lagre">Lagre</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="btn" type="button" id="toast-undo">Angre</button>
  </div>

  <script src="/js/theme.js"></script>
  <script type="module" src="js/kalorier.js?v=6bec68c"></script>
</body>
</html>
